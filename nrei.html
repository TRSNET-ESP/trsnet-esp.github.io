<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRSNET - Nodo Reinosa</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: monospace;
            text-align: center;
            padding-top: 40px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 5px; color: #ffffff; }
        .sub { font-size: 12px; color: #9ca3af; margin-bottom: 20px; }
        #status {
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
            background: #1f2937;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .logs {
            margin-top: 15px;
            font-size: 10px;
            color: #6b7280;
            text-align: left;
            height: 70px;
            overflow-y: hidden;
            background: #030712;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>TRSNET REINOSA</h2>
        <div class="sub">Nodo Receptor 0.5W - Auto-Recovery</div>
        
        <div id="status" style="color: #fbbf24;">Iniciando sistema...</div>
        
        <!-- Elemento de audio nativo -->
        <audio id="stream" controls autoplay></audio>

        <div class="logs" id="logBox">Sistema listo. Esperando flujo...</div>
    </div>

    <script>
        const audio = document.getElementById('stream');
        const statusText = document.getElementById('status');
        const logBox = document.getElementById('logBox');

        // URL de tu Tailscale configurada con la IP correcta
        const streamUrl = 'http://100.99.98.47:8090'; 
        let reintentoTimer = null;

        function log(msg) {
            const hora = new Date().toLocaleTimeString();
            logBox.innerHTML = `[${hora}] ${msg}<br>` + logBox.innerHTML;
        }

        function conectarStream() {
            // Evitar bucles de reconexión encimados
            if (reintentoTimer) clearTimeout(reintentoTimer);

            statusText.innerText = "Conectando al estudio...";
            statusText.style.color = "#fbbf24";
            
            // Pausar y limpiar fuente anterior para forzar corte limpio
            audio.pause();
            audio.src = "";
            
            // Asignar nueva URL con parámetro anti-caché limpio
            audio.src = streamUrl + "?nocache=" + Date.now();
            audio.load();
            
            audio.play().then(() => {
                statusText.innerText = "EN DIRECTO (Reproduciendo)";
                statusText.style.color = "#00ffcc";
                log("Flujo conectado correctamente.");
            }).catch(e => {
                statusText.innerText = "Sin señal / Reintentando...";
                statusText.style.color = "#ef4444";
                log("Error de red. Reintento en 5s...");
                reintentoTimer = setTimeout(conectarStream, 5000);
            });
        }

        // Si la red se cae de golpe y el reproductor emite error de carga
        audio.onerror = function() {
            statusText.innerText = "Corte de red detectado";
            statusText.style.color = "#ef4444";
            log("Pérdida de enlace. Reconectando en 5s...");
            if (reintentoTimer) clearTimeout(reintentoTimer);
            reintentoTimer = setTimeout(conectarStream, 5000);
        };

        // Si el stream se congela, entra en búfer infinito o se pausa por la red
        audio.onpause = function() {
            // Solo actúa si no ha sido una pausa manual del usuario o fin de pista
            if (!audio.ended && audio.currentTime > 0) {
                log("Audio congelado o pausado por la red. Forzando rearme...");
                if (reintentoTimer) clearTimeout(reintentoTimer);
                reintentoTimer = setTimeout(conectarStream, 3000);
            }
        };

        // Arrancar al cargar la página
        window.onload = function() {
            log("Iniciando nodo web...");
            conectarStream();
        };
    </script>

</body>
</html>
